<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>StandClick</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <!-- Загрузка -->

    <div id="loading">

        <div class="loading-title">
            StandClick
        </div>

        <div class="loading-bar">
            <div id="loading-progress"></div>
        </div>

        <div id="loading-percent">
            0%
        </div>

    </div>


    <!-- Игра -->

    <div id="game" class="hidden">

        <main id="screen">

            <div class="gold">
                <span id="gold">0</span> G
            </div>

            <button
                id="click-button"
                class="click-button"
            >
                G
            </button>

        </main>


        <!-- Нижняя навигация -->

        <nav class="bottom-nav">

            <button
                class="nav-button active"
                data-screen="menu"
            >
                Меню
            </button>

            <button
                class="nav-button"
                data-screen="cases"
            >
                Кейсы
            </button>

            <button
                class="nav-button"
                data-screen="settings"
            >
                Настройки
            </button>

        </nav>

    </div>


    <script src="/static/app.js"></script>

</body>

</html>
